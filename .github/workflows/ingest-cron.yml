name: ingest-cron

on:
  schedule:
    # Every 30 minutes: fallback for the just-in-time Convex cron dispatch.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest-cron
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Ingest due sessions
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FASTF1_CACHE: ${{ runner.temp }}/fastf1-cache
        run: python -m ingest.cli run-due
